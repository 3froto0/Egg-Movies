<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Details</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;}
.container{padding:20px;}
h1{margin-bottom:10px;}
img{width:200px;border-radius:8px;float:left;margin-right:20px;}
iframe{width:100%;height:400px;margin-top:20px;}
button{padding:10px 20px;background:#ff416c;color:#fff;border:none;border-radius:5px;cursor:pointer;margin-top:20px;}
</style>
</head>
<body>

<div class="container">
  <div id="movie-details"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");

fetch("movies.json")
.then(res=>res.json())
.then(data=>{
    const movie = data.find(m=>m.id==id);
    if(movie){
        document.getElementById("movie-details").innerHTML = `
            <img src="${movie.poster}" alt="${movie.title_en}">
            <h1>${movie.title_en} | ${movie.title_ar}</h1>
            <p><strong>Genre:</strong> ${movie.genre}</p>
            <p><strong>Release Date:</strong> ${movie.release_date}</p>
            <p>${movie.description}</p>
            <iframe src="https://www.youtube.com/${encodeURIComponent(movie + ' trailer')}" allowfullscreen></iframe>
            <br>
            <a href="https://www.google.com/search?q=watch+${encodeURIComponent(movie.title_en)}" target="_blank">
                <button>شاهد الآن على المنصة الرسمية</button>
            </a>
        `;
    } else {
        document.body.innerHTML = "<h2>الفيلم غير موجود حالياً</h2>";
    }
});
</script>

</body>
</html>
