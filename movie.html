<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;}
.player{width:100%;height:80vh;}
iframe{width:100%;height:100%;border:none;}
</style>
</head>
<body>

<div class="player">
<iframe id="player" allowfullscreen></iframe>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");

fetch("movies.json")
.then(res=>res.json())
.then(data=>{
    const movie = data.find(m=>m.id==id);
    if(movie && movie.embed){
        document.getElementById("player").src = movie.embed;
    } else {
        document.body.innerHTML = "<h2>الفيلم غير متوفر حالياً أو غير قانوني</h2>";
    }
});
</script>

</body>
</html>
